<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوابة الجهات — أفناد سنا</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<link rel="stylesheet" href="assets/css/style.css?v=20260902f">
<script>
/* يُطبَّق قبل الرسم لتفادي وميض الوضع الفاتح */
(function () {
  try {
    var t = localStorage.getItem('afnad-theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
})();
</script>
</head>
<body>

<!-- ======================= تسجيل دخول الجهة ======================= -->
<div class="auth-screen" id="authScreen" hidden>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>
        </svg>
      </div>
      <h1>بوابة الجهات</h1>
      <p>تقرير أداء حملاتك مع شركة أفناد سنا</p>
    </div>

    <form class="auth-form" id="authForm" autocomplete="on">
      <div class="field">
        <label for="pEmail">البريد الإلكتروني</label>
        <input type="email" id="pEmail" required autocomplete="username"
               placeholder="name@jamiya.org" dir="ltr">
      </div>
      <div class="field">
        <label for="pPass">كلمة المرور</label>
        <input type="password" id="pPass" required autocomplete="current-password"
               placeholder="••••••••" dir="ltr">
      </div>
      <div class="auth-msg" id="authMsg" hidden></div>
      <button type="submit" class="btn btn-primary auth-submit" id="pSubmit">تسجيل الدخول</button>
    </form>

    <p class="auth-foot">
      الحساب يُنشَأ من إدارة أفناد سنا. للاستفسار تواصل معنا.
    </p>
  </div>
</div>

<!-- شاشة التحميل -->
<div class="boot-screen" id="bootScreen">
  <div class="boot-spin"></div>
  <p id="bootMsg">جارٍ التحميل…</p>
</div>

<!-- ======================= البوابة ======================= -->
<div class="portal" id="portalRoot" hidden>
  <header class="p-top">
    <div class="p-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>
        </svg>
      </div>
      <div>
        <h1 id="clientName">—</h1>
        <span>بوابة الجهات — أفناد سنا</span>
      </div>
    </div>
    <div class="p-top-actions">
      <button class="theme-btn" id="themeBtn" aria-label="تبديل الوضع الليلي" title="الوضع الليلي">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="ghost-btn" id="pLogout">
        تسجيل الخروج
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <main class="p-main" id="pHost"></main>
</div>

<div class="toast-host" id="toastHost"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js?v=20260902f"></script>
<script src="assets/js/charts.js?v=20260902f"></script>
<script src="assets/js/portal.js?v=20260902f"></script>
</body>
</html>
